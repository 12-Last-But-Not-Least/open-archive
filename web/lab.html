<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Researchers and publications at {{NAME}}.">
  <title>{{SHORT_NAME}} · open archive</title>
  <link rel="stylesheet" href="{{ROOT}}assets/style.css">
  <script type="module" src="{{ROOT}}assets/app.js"></script>
</head>
<body data-api-root="{{API_ROOT}}" data-page="lab" data-id="{{ID}}" data-root="{{ROOT}}">
  <header>
    <nav aria-label="Main"><a href="{{ROOT}}">Open Archive</a> | <a href="{{ROOT}}researchers/">Researchers</a> | <a href="{{ROOT}}labs/" aria-current="location">Labs</a> | <a href="{{ROOT}}publications/">Publications</a>{{ACCOUNT_LINK}}</nav>
  </header>
  <main>
    <section class="profile">
      <h1>{{NAME}}</h1>
      <p class="institution">{{INSTITUTION}}</p>
      {{DEMO_NOTE}}
    </section>
    <section aria-labelledby="members-heading">
      <h2 id="members-heading">Researchers ({{MEMBER_COUNT}})</h2>
      <div class="directory">{{MEMBERS}}</div>
    </section>
    <section aria-labelledby="publications-heading">
      <div class="section-heading"><h2 id="publications-heading">Publications</h2> <button id="refresh" type="button">Refresh</button></div>
      <p id="sync-status" role="status"></p>
      <div id="publication-list" aria-live="polite">{{PUBLICATIONS}}</div>
    </section>
  </main>
  <footer><a href="https://github.com/12-Last-But-Not-Least/open-archive">Source code</a></footer>
</body>
</html>
