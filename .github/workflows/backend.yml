name: Publish backend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_backend.py tests/test_hosting.py
      - run: node --test tests/*.test.js
      - name: Build backend container
        run: docker build -t open-archive-check .
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RAILWAY_SERVICE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: backend
      url: ${{ vars.OPEN_ARCHIVE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Railway CLI
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            'https://github.com/railwayapp/cli/releases/download/v5.71.0/railway-v5.71.0-x86_64-unknown-linux-musl.tar.gz?download=1' \
            --output "$RUNNER_TEMP/railway.tar.gz"
          echo "2e682fd2ddf8d6fdf9e46d9d99d99646ff0022a6abb0c2bca93011348a269fb9  $RUNNER_TEMP/railway.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/railway-bin"
          tar -xzf "$RUNNER_TEMP/railway.tar.gz" -C "$RUNNER_TEMP/railway-bin" railway
          chmod +x "$RUNNER_TEMP/railway-bin/railway"
          echo "$RUNNER_TEMP/railway-bin" >> "$GITHUB_PATH"
      - name: Deploy and verify the new revision
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          OPEN_ARCHIVE_BACKEND_URL: ${{ vars.OPEN_ARCHIVE_BACKEND_URL }}
        run: python scripts/deploy_backend.py
  setup-status:
    if: github.ref == 'refs/heads/main' && vars.RAILWAY_SERVICE_ID == ''
    runs-on: ubuntu-latest
    steps:
      - name: Report missing hosting connection
        run: echo 'Backend deployment is not enabled yet. Connect Railway and configure the service, persistent volume, repository token, and backend URL described in README.md.' >> "$GITHUB_STEP_SUMMARY"
